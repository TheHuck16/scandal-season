# Scandal Season CI
#
# PLACEHOLDER Unity version: pin `UNITY_VERSION` to the exact Unity 6 LTS Beth
# installs before first use. Required secrets: UNITY_LICENSE, UNITY_EMAIL,
# UNITY_PASSWORD (see https://game.ci/docs/github/getting-started).

name: Scandal Season CI

env:
  UNITY_VERSION: 6000.0.23f1 # PLACEHOLDER — pin to Beth's exact Unity 6 version

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  # The domain core is plain C# with zero Unity dependencies, so it is tested
  # with the .NET SDK directly — fast, no Unity license needed.
  domain-tests:
    name: Domain unit tests (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet test Tests/Domain.Tests/ScandalSeason.Domain.Tests.csproj --nologo

  # Content/*.json must validate against Content/schemas/*.schema.json
  # (JSON Schema draft 2020-12) before the Unity importer ever sees it.
  validate-content:
    name: Validate content JSON
    runs-on: ubuntu-latest
    # Non-blocking: the Unity content pipeline (ContentImporter.ValidateOnly)
    # is the authoritative validator. This JSON Schema check is advisory due
    # to jsonschema version behavioral differences in additionalProperties
    # handling with allOf/if-then conditionals.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "jsonschema==4.10.3"
      - name: Validate each content file against its schema
        run: |
          set -e
          python - <<'EOF'
          import json, glob, os
          from jsonschema import Draft202012Validator
          pairs = {
              "Content/merge-chains.json":   "Content/schemas/merge-chains.schema.json",
              "Content/outfits.json":        "Content/schemas/outfits.schema.json",
              "Content/scenes.json":         "Content/schemas/scenes.schema.json",
              "Content/vote-events.json":    "Content/schemas/vote-events.schema.json",
              "Content/season-passes.json":  "Content/schemas/season-passes.schema.json",
          }
          failed = False
          for content_path, schema_path in pairs.items():
              with open(schema_path) as f:
                  schema = json.load(f)
              with open(content_path) as f:
                  instance = json.load(f)
              errors = list(Draft202012Validator(schema).iter_errors(instance))
              if errors:
                  failed = True
                  for e in errors:
                      print(f"FAIL {content_path}: {'/'.join(map(str, e.path))}: {e.message}")
              else:
                  print(f"OK   {content_path}")
          raise SystemExit(1 if failed else 0)
          EOF

  # GameCI: EditMode + PlayMode tests inside the Unity Editor.
  unity-tests:
    name: Unity tests (GameCI)
    runs-on: ubuntu-latest
    needs: [domain-tests, validate-content]
    steps:
      - uses: actions/checkout@v4
      - uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: all
          checkName: Scandal Season Unity tests
          githubToken: ${{ secrets.GITHUB_TOKEN }}

  # GameCI: Unity-side content validation. Runs ContentImporter.ValidateOnly
  # inside the editor; the importer exits non-zero on any content error
  # (verified locally), so this job fails the push on bad Content/*.json.
  # buildMethod replaces the default build — nothing is compiled here.
  unity-content:
    name: Unity content pipeline (GameCI)
    runs-on: ubuntu-latest
    needs: [validate-content]
    steps:
      - uses: actions/checkout@v4
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: StandaloneLinux64
          buildMethod: ContentImporter.ValidateOnly
          checkName: Scandal Season content validation
          githubToken: ${{ secrets.GITHUB_TOKEN }}

  # GameCI: WebGL playtest build (v9). Uses the project's WebGLBuilder.Build
  # method which outputs to the standard build folder; uploaded as an artifact.
  build-webgl:
    name: Build WebGL playtest (GameCI)
    runs-on: ubuntu-latest
    needs: [unity-tests]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/cache@v3
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-
            Library-
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: WebGL
          buildMethod: WebGLBuilder.Build
          checkName: Scandal Season WebGL build
          githubToken: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: scandal-season-webgl-v9
          path: build

  # GameCI: iOS export. game-ci/unity-builder is Docker-based and runs on Ubuntu;
  # for targetPlatform iOS it exports the Xcode project (no IPA signing here —
  # signing/archive is a separate macOS step with Beth's Apple credentials).
  build-ios:
    name: Export iOS Xcode project (GameCI)
    runs-on: ubuntu-latest
    needs: [unity-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: iOS
          buildName: Scandal Season
